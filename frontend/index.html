<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>

	<link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
    	<h1>My Personal Blog</h1>
    </header>

    <section>
    	<h2>Previous posts</h2>
    	
    	<div id="previous-posts-container"></div>
    </section>
    
    <br>
    
    <section>
    	<h2>Create post</h2>
    	<form id="create-post">
    	    <div>
    	    	<label for="post-title">Title</label>
    	    	<input type="text" id="post-title" name="post-title" placeholder="Enter title" required>
    	    </div>
    	    <div>
    	    	<label for="post-content">Content</label>
    	    	<textarea type="text" id="post-content" name="post-content" placeholder="Enter content" required></textarea>
    	    </div>
    	    <div>
    	    	<button type="submit">Create post</button>
    	    </div>
    	</form>
    </section>
    
    <br>
    
    <section>
    	<h2>Update post</h2>
    	<form action="/submit-form" method="POST">
    	    <div>
    	    	<label for="select-post-update">Select post to update: </label>
    	    	<select name="select-post-update" id="select-post-update">
    	    	    <option value="">--Select post--</option>
    	    	</select>
    	    </div>
    	    <div>
    	    	<label for="update-post-title">New title</label>
    	    	<input type="text" id="update-post-title" name="post-title" placeholder="Enter updated title" required>
    	    </div>
    	    <div>
    	    	<label for="update-post-content">New content</label>
    	    	<textarea type="text" id="update-post-content" name="post-content" placeholder="Enter updated content" required></textarea>
    	    </div>
    	    <div>
    	    	<button type="submit">Update post</button>
    	    </div>
    	</form>
    </section>
    
    <br>
    
    <section>
    	<h2>Delete post</h2>
    	<form action="/submit-form" method="POST">
    	    <div>
    	    	<label for="select-post-delete">Select post to delete: </label>
    	    	<select name="select-post-delete" id="select-post-delete">
    	    	    <option value="">--Select post--</option>
    	    	</select>
    	    </div>
    	    <div>
    	    	<button type="submit">Delete post</button>
    	    </div>
    	</form>
    </section>
    
	<script src="script.js"></script>
</body>
</html>
